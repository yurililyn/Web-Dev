<h2>Album list</h2>

@if (loading) {
  <p>Loading albums...</p>
} @else {
  <ul class="album-list">
    @for (album of albums; track album.id) {
      <li class="album-item">
        <a [routerLink]="['/albums', album.id]" class="album-link">[{{album.id}}] {{album.title}}</a>
        <button (click)="deleteAlbum(album.id)" class="delete-btn">Delete</button>
      </li>
    }
  </ul>
}
